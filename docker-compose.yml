services:
  postgres:
    image: postgres:16-alpine
    container_name: aiub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiub_jobfair}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aiub_jobfair}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: aiub_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: PostgreSql
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-aiub_jobfair};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: aiub_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:5000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
